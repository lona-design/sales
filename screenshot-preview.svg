<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Subtle Grid Background -->
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Header Banner -->
  <g transform="translate(60, 60)">
    <rect width="48" height="48" rx="12" fill="url(#primaryGrad)"/>
    <polyline points="14,34 22,22 28,28 36,14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff">ApexSales Analytics</text>
    <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Executive Sales Performance &amp; Revenue Intelligence Dashboard</text>
  </g>

  <!-- KPI Cards Mock -->
  <g transform="translate(60, 160)">
    <!-- Card 1 -->
    <rect width="250" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">GROSS REVENUE</text>
    <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#ffffff">$156,480</text>
    <text x="24" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">+14.8% vs last period</text>

    <!-- Card 2 -->
    <rect x="275" width="250" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="299" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">NET PROFIT</text>
    <text x="299" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#ffffff">$94,220</text>
    <text x="299" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#60a5fa">Margin: 60.2%</text>

    <!-- Card 3 -->
    <rect x="550" width="250" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="574" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">TOTAL ORDERS</text>
    <text x="574" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#ffffff">342</text>
    <text x="574" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a78bfa">94% Fulfilled</text>

    <!-- Card 4 -->
    <rect x="825" width="255" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="849" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">AVG ORDER VALUE</text>
    <text x="849" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#ffffff">$3,485</text>
    <text x="849" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fbbf24">Healthy Deal Size</text>
  </g>

  <!-- Big Chart Mock -->
  <g transform="translate(60, 310)">
    <rect width="700" height="260" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Revenue &amp; Profit Trajectory</text>
    <text x="24" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">Daily breakdown with interactive tooltips</text>
    
    <!-- Chart lines -->
    <path d="M 40 210 Q 150 180, 240 140 T 420 110 T 560 70 T 660 45 L 660 220 L 40 220 Z" fill="rgba(37, 99, 235, 0.2)"/>
    <path d="M 40 210 Q 150 180, 240 140 T 420 110 T 560 70 T 660 45" fill="none" stroke="#3b82f6" stroke-width="3"/>
    
    <path d="M 40 215 Q 150 195, 240 170 T 420 145 T 560 110 T 660 90 L 660 220 L 40 220 Z" fill="rgba(16, 185, 129, 0.15)"/>
    <path d="M 40 215 Q 150 195, 240 170 T 420 145 T 560 110 T 660 90" fill="none" stroke="#10b981" stroke-width="2.5"/>
  </g>

  <!-- Donut Chart Mock -->
  <g transform="translate(790, 310)">
    <rect width="350" height="260" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Category Distribution</text>
    <circle cx="175" cy="145" r="65" fill="none" stroke="#2563eb" stroke-width="24" stroke-dasharray="140 300"/>
    <circle cx="175" cy="145" r="65" fill="none" stroke="#10b981" stroke-width="24" stroke-dasharray="90 300" stroke-dashoffset="-145"/>
    <circle cx="175" cy="145" r="65" fill="none" stroke="#f59e0b" stroke-width="24" stroke-dasharray="60 300" stroke-dashoffset="-240"/>
    <circle cx="175" cy="145" r="65" fill="none" stroke="#8b5cf6" stroke-width="24" stroke-dasharray="50 300" stroke-dashoffset="-305"/>
    <text x="175" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff">100%</text>
    <text x="175" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Active Share</text>
  </g>
</svg>

